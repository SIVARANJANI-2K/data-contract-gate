spring.application.name=cap34-backend
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/data_contract_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
cap34.upload-dir=${UPLOAD_DIR:./uploads}

# Python Engine Configuration
cap34.python.base-url=http://localhost:8001
cap34.aws.s3.bucket=cap34-data-contract-storage
