
name: CAP-34 CI Pipeline

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  springboot-build:
    name: Spring Boot Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and verify Spring Boot
        working-directory: springboot-backend
        run: mvn -B clean verify

  python-validation:
    name: Python Validation Engine
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: Python-Engine/requirements.txt

      - name: Install dependencies
        working-directory: Python-Engine
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Check Python syntax
        working-directory: Python-Engine
        run: python -m compileall -q .

      - name: Run Python tests
        working-directory: Python-Engine
        run: python -m pytest -v tests/
      - name: Run compatibility gate
        working-directory: Python-Engine
        run: |
          python -m compatibility.ci_gate \
            ci_contracts/orders/approved.json \
            ci_contracts/orders/proposed.json